# Packs the realm-as-code file into the ConfigMap read by the
# keycloak-config-cli Job (deploy/kustomize/base/realm-import). Kept next to
# the realm file because kustomize only loads files under its own root.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: fintechbankx-realm
    files:
      - fintechbankx-realm.json
    options:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
        app.kubernetes.io/part-of: fintechbankx-identity
  # Fine-grained admin permissions, applied by the Job's second step
  # (separate ConfigMap: keycloak-config-cli imports every *.json in /config).
  - name: fintechbankx-realm-admin-permissions
    files:
      - admin-permissions.json
    options:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
        app.kubernetes.io/part-of: fintechbankx-identity
  # Open-finance TPP clients, onboarded by the Job's last step
  # (scripts/realm/onboard-tpp.mjs); not a realm file for keycloak-config-cli.
  - name: fintechbankx-realm-tpp-clients
    files:
      - tpp-clients.json
    options:
      labels:
        app.kubernetes.io/name: keycloak-realm-import
        app.kubernetes.io/part-of: fintechbankx-identity
