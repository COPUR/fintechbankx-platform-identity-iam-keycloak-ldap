# OpenLDAP administrative and read-only bind credentials. The read-only bind
# credential is the same value Keycloak uses (<env>/identity-keycloak/ldap-bind).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openldap
  labels:
    app.kubernetes.io/name: openldap
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-platform
  target:
    name: openldap
    creationPolicy: Owner
  data:
    - secretKey: LDAP_ADMIN_PASSWORD
      remoteRef:
        key: ENVIRONMENT/identity-openldap/admin
        property: admin_credential
    - secretKey: LDAP_CONFIG_PASSWORD
      remoteRef:
        key: ENVIRONMENT/identity-openldap/admin
        property: config_credential
    - secretKey: LDAP_READONLY_USER_PASSWORD
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/ldap-bind
        property: bind_credential
