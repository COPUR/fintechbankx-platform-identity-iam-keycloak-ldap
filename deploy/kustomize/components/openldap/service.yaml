apiVersion: v1
kind: Service
metadata:
  name: openldap
  labels:
    app.kubernetes.io/name: openldap
spec:
  selector:
    app.kubernetes.io/name: openldap
  ports:
    - name: tcp-ldap
      port: 389
      targetPort: ldap
---
apiVersion: v1
kind: Service
metadata:
  name: openldap-headless
  labels:
    app.kubernetes.io/name: openldap
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: openldap
  ports:
    - name: tcp-ldap
      port: 389
      targetPort: ldap
