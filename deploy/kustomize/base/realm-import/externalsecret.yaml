# Secret inputs of the realm import Job: the master-realm admin client, the
# LDAP bind credential and one OIDC client credential per service and staff SSO client. Each
# service credential is the same Secrets Manager entry the service itself
# reads (<env>/<service-slug>/oidc-client), so Keycloak and the service can
# never disagree. Written by scripts/identity/publish-oidc-client-secrets.sh.
# Generated from realm/service-clients.json; CI checks it stays in sync.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-realm-import
  labels:
    app.kubernetes.io/name: keycloak-realm-import
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager-platform
  target:
    name: keycloak-realm-import
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_CLIENTID
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/bootstrap-admin-client
        property: client_id
    - secretKey: KEYCLOAK_CLIENTSECRET
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/bootstrap-admin-client
        property: client_secret
    - secretKey: LDAP_BIND_CREDENTIAL
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/ldap-bind
        property: bind_credential
    - secretKey: FBX_OIDC_SECRET_SVC_LN_LOAN_LIFECYCLE
      remoteRef:
        key: ENVIRONMENT/loan-lifecycle-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_PAY_INITIATION_SETTLEMENT
      remoteRef:
        key: ENVIRONMENT/payment-initiation-settlement-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_PAY_RECURRING_MANDATES
      remoteRef:
        key: ENVIRONMENT/payment-recurring-mandates-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_PAY_BULK_ORCHESTRATION
      remoteRef:
        key: ENVIRONMENT/payment-bulk-orchestration-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_PAY_REQUEST_TO_PAY
      remoteRef:
        key: ENVIRONMENT/payment-request-to-pay-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_CUS_PROFILE_KYC
      remoteRef:
        key: ENVIRONMENT/customer-profile-kyc-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_RSK_DECISIONING
      remoteRef:
        key: ENVIRONMENT/risk-decisioning-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_CMP_EVIDENCE
      remoteRef:
        key: ENVIRONMENT/compliance-evidence-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_CONSENT_AUTHORIZATION
      remoteRef:
        key: ENVIRONMENT/consent-authorization-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_PERSONAL_FINANCIAL_DATA
      remoteRef:
        key: ENVIRONMENT/personal-financial-data-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_BUSINESS_FINANCIAL_DATA
      remoteRef:
        key: ENVIRONMENT/business-financial-data-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_PAYEE_VERIFICATION
      remoteRef:
        key: ENVIRONMENT/payee-verification-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_BANKING_METADATA
      remoteRef:
        key: ENVIRONMENT/banking-metadata-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_OPEN_PRODUCTS_CATALOG
      remoteRef:
        key: ENVIRONMENT/open-products-catalog-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OF_ATM_DIRECTORY
      remoteRef:
        key: ENVIRONMENT/atm-directory-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_ACC_ACCOUNTS_LEDGER
      remoteRef:
        key: ENVIRONMENT/accounts-ledger-service/oidc-client
        property: client_secret
    - secretKey: FBX_OIDC_SECRET_SVC_OBS_GRAFANA
      remoteRef:
        key: ENVIRONMENT/observability-grafana/oidc-client
        property: client_secret
