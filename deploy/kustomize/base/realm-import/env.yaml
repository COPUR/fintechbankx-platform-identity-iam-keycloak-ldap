# Non-secret inputs of the realm import (substituted into
# realm/fintechbankx-realm.json as $(env:NAME) by keycloak-config-cli).
# Base values target the dev/staging OpenLDAP (components/openldap); the prod
# overlay replaces the LDAP_* block with the corporate directory (AWS Managed
# Microsoft AD) and the FBX_* URIs with production channels.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import-env
  labels:
    app.kubernetes.io/name: keycloak-realm-import
data:
  KEYCLOAK_URL: http://keycloak.identity.svc.cluster.local:8080
  KEYCLOAK_GRANTTYPE: client_credentials
  KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
  KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 300s
  IMPORT_FILES_LOCATIONS: file:/config/*.json
  IMPORT_VARSUBSTITUTION_ENABLED: "true"
  IMPORT_VALIDATE: "true"
  IMPORT_CACHE_ENABLED: "true"
  IMPORT_REMOTESTATE_ENABLED: "true"
  # Directory federation (OpenLDAP defaults, base DN dc=fintechbankx,dc=internal).
  LDAP_VENDOR: other
  LDAP_CONNECTION_URL: ldap://openldap.identity.svc.cluster.local:389
  LDAP_START_TLS: "true"
  LDAP_BIND_DN: cn=readonly,dc=fintechbankx,dc=internal
  LDAP_USERS_DN: ou=people,dc=fintechbankx,dc=internal
  LDAP_GROUPS_DN: ou=groups,dc=fintechbankx,dc=internal
  LDAP_USERNAME_ATTRIBUTE: uid
  LDAP_RDN_ATTRIBUTE: uid
  LDAP_UUID_ATTRIBUTE: entryUUID
  LDAP_USER_OBJECT_CLASSES: inetOrgPerson, organizationalPerson
  LDAP_GROUP_OBJECT_CLASSES: groupOfNames
  LDAP_USER_SEARCH_FILTER: ""
  # First-party channel redirect URIs (overlay-specific).
  FBX_WEB_REDIRECT_URI: https://APP_HOST/auth/callback
  FBX_WEB_ORIGIN: https://APP_HOST
  FBX_WEB_POST_LOGOUT_REDIRECT_URI: https://APP_HOST/
  FBX_MOBILE_REDIRECT_URI: com.fintechbankx.mobile:/oauth2redirect
