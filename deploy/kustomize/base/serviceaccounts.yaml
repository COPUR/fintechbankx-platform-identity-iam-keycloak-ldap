# Workload identities named as in the mesh contract (SPIFFE principal
# cluster.local/ns/identity/sa/<name>). None of them needs AWS access: secrets
# reach the pods through External Secrets Operator, so no IRSA annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-realm-import
  labels:
    app.kubernetes.io/name: keycloak-realm-import
automountServiceAccountToken: false
