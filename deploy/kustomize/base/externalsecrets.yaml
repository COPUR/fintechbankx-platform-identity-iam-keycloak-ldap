# Runtime credentials for Keycloak, synced from AWS Secrets Manager by the
# External Secrets Operator (ClusterSecretStore aws-secrets-manager).
# Secret containers are created by deploy/terraform; values are written by
# the DBA bootstrap / identity squad runbook, never by Terraform or Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/db-app
        property: username
    - secretKey: password
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/db-app
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-bootstrap-admin-client
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/bootstrap-admin-client
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: ENVIRONMENT/identity-keycloak/bootstrap-admin-client
        property: client_secret
