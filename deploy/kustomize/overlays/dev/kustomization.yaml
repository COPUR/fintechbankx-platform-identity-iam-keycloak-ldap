# dev: Keycloak + in-cluster OpenLDAP (synthetic staff identities only).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - identity-environment.yaml

components:
  - ../../components/openldap
  - ../../components/environment

patches:
  - target:
      kind: ConfigMap
      name: keycloak-realm-import-env
    patch: |-
      - op: replace
        path: /data/FBX_GRAFANA_ROOT_URL
        value: https://grafana.dev.fintechbankx.example
      - op: replace
        path: /data/FBX_WEB_REDIRECT_URI
        value: https://app.dev.fintechbankx.example/auth/callback
      - op: replace
        path: /data/FBX_WEB_ORIGIN
        value: https://app.dev.fintechbankx.example
      - op: replace
        path: /data/FBX_WEB_POST_LOGOUT_REDIRECT_URI
        value: https://app.dev.fintechbankx.example/
      - op: replace
        path: /data/FBX_STAFF_WEB_REDIRECT_URI
        value: https://staff.dev.fintechbankx.example/auth/callback
      - op: replace
        path: /data/FBX_STAFF_WEB_ORIGIN
        value: https://staff.dev.fintechbankx.example
      - op: replace
        path: /data/FBX_STAFF_WEB_POST_LOGOUT_REDIRECT_URI
        value: https://staff.dev.fintechbankx.example/
  - target:
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
      - op: replace
        path: /spec/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 1536Mi
  - target:
      kind: PodDisruptionBudget
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 4
